name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore AssetForge.sln
      - run: dotnet build AssetForge.sln -c Release --no-restore
      - run: docker build -t assetforge:ci .
